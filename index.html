<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fight of the Sumo Hoppers</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="menu" class="overlay">
    <div class="title-jp">押し相撲</div>
    <h1>FIGHT OF THE<br>SUMO HOPPERS</h1>
    <div class="rule">a tribute to Tuomas Korppi, 1997</div>
    <button id="btn-local">Local &mdash; one screen</button>
    <button id="btn-host">Host online match</button>
    <button id="btn-join">Join online match</button>
    <div id="join-row" class="hidden">
      <input id="join-code" placeholder="room code" autocapitalize="characters" maxlength="4">
      <button id="btn-join-go">Go</button>
    </div>
    <div id="net-status"></div>
  </div>

  <canvas id="game"></canvas>

  <div id="touch-ui" class="hidden">
    <div class="pad pad-p1 hidden" id="pad-p1" data-p="0"></div>
    <div class="pad pad-p2 hidden" id="pad-p2" data-p="1"></div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js?v=5"></script>
  <script src="net.js?v=3"></script>
  <script src="main.js?v=5"></script>
</body>
</html>
